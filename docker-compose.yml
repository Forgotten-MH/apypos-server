services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    networks:
      - explore
    ports:
      - 27017:27017
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8083:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-example}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - explore
    depends_on:
      mongo:
        condition: service_healthy

  server:
    build:
      context: ./
    environment:
      IP: ${IP:-0.0.0.0}
      PORT: ${PORT:-80}
      WEB_URL: ${WEB_URL:-http://0.0.0.0/web}
      RES_URL: ${RES_URL:-http://0.0.0.0/}
      DB_IP: mongo
      DB_PORT: "27017"
      DB_NAME: apypos
      DB_USER: ${MONGO_USER:-root}
      DB_PASSWORD: ${MONGO_PASSWORD:-example}
    ports:
      - 80:80
      - 3000:3000
    restart: always
    volumes:
      - ./src/public:/app/dist/public/
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - explore

networks:
  explore:
    driver: bridge
